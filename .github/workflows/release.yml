name: Build and release

on:
  push:
    tags: ["v*"]          # push a tag like v1.2.0 to publish a release
  workflow_dispatch:      # or run it by hand from the Actions tab to get a test build

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt pyinstaller pyinstaller-hooks-contrib

      - name: Stamp version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "0.0.0" }
          "VERSION = `"$v`"`nREPO = `"${{ github.repository }}`"`n" | Set-Content -Encoding utf8 laughclipper/version.py
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download sound model
        run: python tools/fetch_model.py

      - name: Build app
        run: pyinstaller LaughClipper.spec --noconfirm --clean

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\LaughClipper.iss

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: LaughClipper-Setup
          path: dist/LaughClipper-Setup-*.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LaughClipper-Setup-*.exe
          generate_release_notes: true
